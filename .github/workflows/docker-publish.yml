name: Publicar imagem Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build e push para Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sessão no Docker Hub
        uses: docker/login-action@v3
        with:
          username: miguelarditi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            miguelarditi/caixa-arditi:latest
            miguelarditi/caixa-arditi:${{ github.sha }}
          build-args: |
            SITE_URL=https://caixa.arditi.pt
            GOOGLE_SITE_VERIFICATION=${{ vars.GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
