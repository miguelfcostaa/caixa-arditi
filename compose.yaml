services:
  website:
    image: miguelarditi/caixa-arditi:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SITE_URL: https://caixa.arditi.pt
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-miguelfcostaa/caixa-arditi}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.caixa-arditi.rule=Host(`caixa.arditi.pt`)"
      - "traefik.http.routers.caixa-arditi.entrypoints=https"
      - "traefik.http.routers.caixa-arditi.tls=true"
      - "traefik.http.routers.caixa-arditi.tls.certresolver=letsencrypt"
      - "traefik.http.services.caixa-arditi.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
